<style>
:root{--bg:#0f1115;--surface:#171a21;--surface-2:#1e222b;--line:#2a2f3a;--text:#e7e9ee;--muted:#9aa3b2;--brand:#C026D3;--brand-2:#E879F9;--accent:#F59E0B;--ok:#34D399;--warn:#FBBF24;--danger:#FB7185;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#0f1115;color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:none;color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.demo{background:linear-gradient(90deg,#3b0a45,#1e222b);border-bottom:1px solid var(--line);font-size:13px;color:#f5d0fe}
.demo .wrap{display:flex;gap:12px;align-items:center;min-height:36px;flex-wrap:wrap}
.demo button{background:none;color:#fff;text-decoration:underline;padding:0;font-size:13px}
.top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;height:62px}
.logo img{height:30px;width:auto;display:block}
.spacer{flex:1}
.btn{padding:9px 14px;border-radius:11px;font-weight:700;font-size:14px;background:var(--surface);border:1px solid var(--line);color:var(--text);display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.btn:hover{border-color:#3a4150}
.btn.on{border-color:var(--brand);color:#fff}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:default}
.badge{background:var(--accent);color:#1b1300;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
.hero{padding:34px 0 0}.hero h1{font-size:32px;margin:0 0 6px;letter-spacing:-.01em}.hero p{color:var(--muted);max-width:640px;margin:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 4px}
.inp{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--text);font-size:14px;outline:none}
.inp:focus{border-color:var(--brand)}
.filters input[type=search]{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--brand);color:#fff;background:#2a1530}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0 40px}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.topbar .btn span.t{display:none}}
@media(max-width:440px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#3a4150}
.thumb{height:160px;display:grid;place-items:center;font-size:58px;position:relative}
.thumb .who{position:absolute;left:10px;top:10px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(15,17,21,.75)}
.card .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.tag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pname{font-weight:700;font-size:14px}
.stars{color:var(--accent);font-size:12px}
.price{font-weight:800;font-size:17px;margin-top:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:22px 0}
.panel h2{margin:0 0 12px;font-size:18px}
.muted{color:var(--muted)}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin:26px 0}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.big{height:340px;border-radius:var(--radius);display:grid;place-items:center;font-size:120px;border:1px solid var(--line)}
.citem{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.citem:last-child{border-bottom:0}
.citem .ic{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-size:26px;flex:none}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{background:var(--surface-2);width:30px;height:30px}.qty span{min-width:30px;text-align:center;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.st.paid,.st.fulfilled,.st.transferred{background:rgba(52,211,153,.14);color:var(--ok)}
.st.awaiting_payment,.st.pending{background:rgba(251,191,36,.14);color:var(--warn)}
.st.disputed,.st.refunded,.st.cancelled{background:rgba(251,113,133,.14);color:var(--danger)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi b{display:block;font-size:24px;margin-top:4px}
.kpi small{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars div{flex:1;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bars div span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.bars div em{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-style:normal;color:var(--text)}
.rev{border-top:1px solid var(--line);padding:12px 0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pay label{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600;font-size:14px}
.pay input{accent-color:var(--brand)}
.pay label:has(input:checked){border-color:var(--brand);background:#2a1530}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#0f1115;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.tabs{display:flex;gap:8px;margin:22px 0 0;flex-wrap:wrap}
.split{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.split.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:800;font-size:17px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding:22px 0 40px;margin-top:20px}
</style>
</head>

 var h='<div class="two"><div class="big" style="background:'+grad(p.id+p.nome)+'">'+p.em+'</div><div><span class="tag">'+esc(CATS.filter(function(c){return c[0]===p.cat;})[0][1])+'</span><h1 style="margin:6px 0 4px;font-size:28px">'+esc(p.nome)+'</h1>'
 +(m?'<div class="stars">'+estrelas(m)+' <span class="muted">'+m.toFixed(1)+' · '+p.av.length+' avaliação(ões)</span></div>':'')
 +'<div style="font-size:28px;font-weight:800;margin:14px 0">'+eur(p.preco)+'</div><p class="muted">'+esc(p.desc)+'</p>'
 +'<div class="panel" style="margin:16px 0;padding:14px 16px"><strong>'+esc(v.nome)+'</strong> <span class="muted">· '+(v.tipo==='marca'?'Marca verificada':'Vendedor particular')+' · '+esc(v.local)+'</span><br><span class="muted" style="font-size:13px">'+(p.stock>1?p.stock+' em stock':p.stock===1?'Última unidade':'Esgotado')+' · envio em 1–3 dias úteis · devolução em 14 dias</span></div>'
 +'<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="add"'+(p.stock?'':' disabled')+'>Adicionar ao carrinho</button><button class="btn" id="comprar"'+(p.stock?'':' disabled')+'>Comprar já</button></div></div></div>';
 h+='<div class="panel"><h2>Avaliações</h2>'+(p.av.length?p.av.map(function(r){return '<div class="rev"><span class="stars">'+estrelas(r[0])+'</span> <strong>'+esc(r[1])+'</strong><div class="muted">'+esc(r[2])+'</div></div>';}).join(''):'<p class="muted">Ainda sem avaliações. Só quem comprou pode avaliar.</p>')+'</div>';
 var mais=S.prods.filter(function(x){return x.v===p.v&&x.id!==p.id;}).slice(0,4);
 if(mais.length)h+='<h2 style="font-size:18px;margin:26px 0 0">Mais de '+esc(v.nome)+'</h2><div class="grid">'+mais.map(cartao).join('')+'</div>';
 $('#app').innerHTML=h;
 function add(){var l=S.carr.filter(function(x){return x.p===p.id;})[0];if(l){if(l.q<p.stock)l.q++;}else S.carr.push({p:p.id,q:1});gravar();nCarr();}
 if($('#add'))$('#add').onclick=function(){add();toast('Adicionado ao carrinho');};
 if($('#comprar'))$('#comprar').onclick=function(){add();location.hash='#/carrinho';};
}
function calc(){var sub=0,porV={};S.carr.forEach(function(l){var p=prod(l.p);var t=p.preco*l.q;sub+=t;porV[p.v]=(porV[p.v]||0)+t;});var portes=sub>=PORTES_GRATIS||!sub?0:PORTES;return {sub:sub,portes:portes,total:sub+portes,porV:porV};}
function carrinho(){
 if(!S.carr.length){$('#app').innerHTML='<div class="panel" style="text-align:center;padding:48px"><div style="font-size:48px">🛒</div><h2>O carrinho está vazio</h2><p class="muted">Explora a loja e junta produtos de vários vendedores numa só compra.</p><a class="btn primary" href="#/">Ir para a loja</a></div>';return;}
 var c=calc();
 var h='<div class="two"><div class="panel"><h2>Carrinho</h2>'+S.carr.map(function(l,i){var p=prod(l.p);return '<div class="citem"><div class="ic" style="background:'+grad(p.id+p.nome)+'">'+p.em+'</div><div style="flex:1"><div class="pname">'+esc(p.nome)+'</div><div class="muted" style="font-size:13px">'+esc(VEND[p.v].nome)+' · '+eur(p.preco)+'</div></div><div class="qty"><button data-m="'+i+'" aria-label="Menos">−</button><span>'+l.q+'</span><button data-p="'+i+'" aria-label="Mais">+</button></div><strong style="min-width:80px;text-align:right">'+eur(p.preco*l.q)+'</strong></div>';}).join('')+'</div>';
 h+='<div class="panel"><h2>Resumo</h2><div class="split"><span>Subtotal</span><span>'+eur(c.sub)+'</span></div><div class="split"><span>Portes</span><span>'+(c.portes?eur(c.portes):'Grátis')+'</span></div>'+(c.portes?'<div class="muted" style="font-size:13px">Portes grátis a partir de '+eur(PORTES_GRATIS)+'.</div>':'')+'<div class="split tot"><span>Total</span><span>'+eur(c.total)+'</span></div>'
  +'<div class="muted" style="font-size:13px;margin:12px 0">Esta compra tem '+Object.keys(c.porV).length+' vendedor(es). Pagas tudo de uma vez; a Stripe reparte por cada um.</div><a class="btn primary" style="width:100%;justify-content:center" href="#/checkout">Finalizar compra</a></div></div>';
 $('#app').innerHTML=h;
 [].forEach.call(document.querySelectorAll('[data-m]'),function(b){b.onclick=function(){var l=S.carr[b.dataset.m];l.q--;if(l.q<1)S.carr.splice(b.dataset.m,1);gravar();nCarr();carrinho();};});
 [].forEach.call(document.querySelectorAll('[data-p]'),function(b){b.onclick=function(){var l=S.carr[b.dataset.p];if(l.q<prod(l.p).stock)l.q++;else toast('Sem mais stock');gravar();nCarr();carrinho();};});
}
function checkout(){
 if(!S.carr.length){location.hash='#/carrinho';return;}
 var c=calc();
 var h='<div class="two"><form class="panel" id="fChk"><h2>Entrega</h2><div class="field"><label for="n">Nome</label><input class="inp" id="n" required value="Cliente Demonstração"></div><div class="field"><label for="m">Morada</label><input class="inp" id="m" required value="Rua das Flores, 12, 1200-195 Lisboa"></div><div class="field"><label for="e">Email</label><input class="inp" id="e" type="email" required value="cliente@exemplo.pt"></div>'
  +'<h2 style="margin-top:18px">Pagamento</h2><div class="pay"><label><input type="radio" name="pg" value="Cartão" checked> 💳 Cartão</label><label><input type="radio" name="pg" value="MB WAY"> 📱 MB WAY</label><label><input type="radio" name="pg" value="Multibanco"> 🏧 Multibanco</label></div>'
  +'<p class="muted" style="font-size:13px">Na versão real o pagamento é feito na página segura da Stripe. Aqui é simulado.</p><button class="btn primary" style="width:100%;justify-content:center;margin-top:6px">Pagar '+eur(c.total)+'</button></form>';
 h+='<div class="panel"><h2>Para onde vai o dinheiro</h2><table><thead><tr><th>Vendedor</th><th style="text-align:right">Vendas</th><th style="text-align:right">Recebe</th></tr></thead><tbody>'+Object.keys(c.porV).map(function(v){return '<tr><td>'+esc(VEND[v].nome)+(VEND[v].stripe?'':' <span class="st pending">sem conta Stripe</span>')+'</td><td style="text-align:right">'+eur(c.porV[v])+'</td><td style="text-align:right">'+eur(c.porV[v]*(1-COMISSAO))+'</td></tr>';}).join('')+'</tbody></table><div class="split" style="margin-top:10px"><span class="muted">Comissão Bazora (10 %)</span><span>'+eur(c.sub*COMISSAO)+'</span></div><div class="split"><span class="muted">Portes</span><span>'+eur(c.portes)+'</span></div></div></div>';
 $('#app').innerHTML=h;
 $('#fChk').onsubmit=function(ev){ev.preventDefault();var met=(document.querySelector('input[name=pg]:checked')||{}).value||'Cartão';
  var id='BZ-'+(10430+S.minhas.length);var e={id:id,data:hoje(0),cliente:$('#n').value,linhas:S.carr.map(function(l){return {p:l.p,q:l.q,preco:prod(l.p).preco};}),metodo:met,estado:met==='Multibanco'?'awaiting_payment':'paid',env:'',portes:c.portes};
  e.linhas.forEach(function(l){var p=prod(l.p);p.stock=Math.max(0,p.stock-l.q);});
  S.minhas.unshift(e);S.enc.unshift(e);S.carr=[];gravar();nCarr();location.hash='#/encomendas/'+id;};
}
function encomendas(sel){
 if(!S.minhas.length){$('#app').innerHTML='<div class="panel" style="text-align:center;padding:48px"><div style="font-size:48px">📦</div><h2>Ainda não tens encomendas</h2><p class="muted">Quando comprares, acompanhas aqui o pagamento e o envio de cada vendedor.</p><a class="btn primary" href="#/">Ir para a loja</a></div>';return;}
 var h='<h1 style="font-size:26px;margin:26px 0 0">As minhas encomendas</h1>';
 S.minhas.forEach(function(e){var tot=totEnc(e)+(e.portes||0);
  h+='<div class="panel"'+(e.id===sel?' style="border-color:var(--brand)"':'')+'><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><strong>'+e.id+'</strong> <span class="muted">· '+e.data+' · '+e.metodo+'</span></div>'+st(e.estado)+'</div>';
  if(e.estado==='awaiting_payment')h+='<div class="panel" style="margin:12px 0;padding:12px 14px;background:var(--surface-2)">Referência Multibanco — Entidade <strong>21 312</strong> · Referência <strong>912 345 678</strong> · Valor <strong>'+eur(tot)+'</strong><br><button class="btn sm" style="margin-top:8px" data-pagar="'+e.id+'">Simular pagamento</button></div>';
  h+=e.linhas.map(function(l){var p=prod(l.p);return '<div class="citem"><div class="ic" style="background:'+grad(p.id+p.nome)+'">'+p.em+'</div><div style="flex:1"><div class="pname">'+esc(p.nome)+' × '+l.q+'</div><div class="muted" style="font-size:13px">Vendido por '+esc(VEND[p.v].nome)+'</div></div><strong>'+eur(l.preco*l.q)+'</strong></div>';}).join('');
  h+='<div class="split tot"><span>Total</span><span>'+eur(tot)+'</span></div></div>';});
 $('#app').innerHTML=h;
 [].forEach.call(document.querySelectorAll('[data-pagar]'),function(b){b.onclick=function(){S.enc.concat(S.minhas).forEach(function(e){if(e.id===b.dataset.pagar)e.estado='paid';});gravar();toast('Pagamento recebido');encomendas(b.dataset.pagar);};});
}
function vender(){
 var vid=S.vendedorAtual,v=VEND[vid];
 var minhas=S.enc.filter(function(e){return e.linhas.some(function(l){return prod(l.p).v===vid;});});
 function minhaParte(e){return e.linhas.filter(function(l){return prod(l.p).v===vid;}).reduce(function(a,l){return a+l.preco*l.q;},0);}
 var bruto=minhas.filter(function(e){return ['paid','transferred','fulfilled'].indexOf(e.estado)>=0;}).reduce(function(a,e){return a+minhaParte(e);},0);
 var porEnviar=minhas.filter(function(e){return e.estado==='paid'||e.estado==='transferred';}).length;
 var meus=S.prods.filter(function(p){return p.v===vid;});
 var h='<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:26px"><div><span class="tag">Painel do vendedor</span><h1 style="font-size:26px;margin:4px 0 0">'+esc(v.nome)+'</h1></div><label class="muted" style="font-size:13px">Ver como <select class="inp" id="vsel">'+Object.keys(VEND).map(function(k){return '<option value="'+k+'"'+(k===vid?' selected':'')+'>'+esc(VEND[k].nome)+'</option>';}).join('')+'</select></label></div>';
 if(!v.stripe)h+='<div class="panel" style="border-color:var(--warn)"><strong>Liga a tua conta Stripe para receber.</strong><p class="muted" style="margin:6px 0 10px">Sem conta ligada, os teus produtos aparecem na loja mas as vendas ficam retidas.</p><button class="btn primary" id="stripe">Ligar conta Stripe</button></div>';
 h+='<div class="kpis"><div class="kpi"><small>Vendas pagas</small><b>'+eur(bruto)+'</b></div><div class="kpi"><small>Recebes (após 10 %)</small><b>'+eur(bruto*(1-COMISSAO))+'</b></div><div class="kpi"><small>Por enviar</small><b>'+porEnviar+'</b></div><div class="kpi"><small>Produtos</small><b>'+meus.length+'</b></div></div>';
 var dias=[6,5,4,3,2,1,0].map(function(d){var dt=hoje(d);var t=minhas.filter(function(e){return e.data===dt;}).reduce(function(a,e){return a+minhaParte(e);},0);return {d:dt.slice(8)+'/'+dt.slice(5,7),t:t};});
 var mx=Math.max.apply(null,dias.map(function(x){return x.t;}).concat([1]));
 h+='<div class="panel"><h2>Vendas dos últimos 7 dias</h2><div class="bars" style="margin-bottom:26px">'+dias.map(function(x){return '<div style="height:'+Math.max(3,x.t/mx*100)+'%"><em>'+(x.t?Math.round(x.t)+' €':'')+'</em><span>'+x.d+'</span></div>';}).join('')+'</div></div>';
 h+='<div class="panel"><h2>Encomendas</h2>'+(minhas.length?'<table><thead><tr><th>N.º</th><th>Data</th><th>Cliente</th><th style="text-align:right">Valor</th><th>Estado</th><th></th></tr></thead><tbody>'+minhas.map(function(e){return '<tr><td>'+e.id+'</td><td>'+e.data+'</td><td>'+esc(e.cliente)+'</td><td style="text-align:right">'+eur(minhaParte(e))+'</td><td>'+st(e.estado)+(e.env?'<div class="muted" style="font-size:12px">'+esc(e.env)+'</div>':'')+'</td><td>'+((e.estado==='paid'||e.estado==='transferred')?'<button class="btn sm" data-env="'+e.id+'">Marcar enviada</button>':'')+'</td></tr>';}).join('')+'</tbody></table>':'<p class="muted">Ainda sem encomendas.</p>')+'</div>';
 h+='<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">Produtos</h2><button class="btn sm primary" id="novo">+ Novo produto</button></div><form id="fNovo" style="display:none;margin-top:14px"><div class="two" style="margin:0;gap:12px"><div class="field"><label for="pn">Nome</label><input class="inp" id="pn" required></div><div class="field"><label for="pp">Preço (€)</label><input class="inp" id="pp" type="number" min="0.5" step="0.01" required></div></div><div class="two" style="margin:0;gap:12px"><div class="field"><label for="pc">Categoria</label><select class="inp" id="pc">'+CATS.map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>';}).join('')+'</select></div><div class="field"><label for="ps">Stock</label><input class="inp" id="ps" type="number" min="1" value="1" required></div></div><button class="btn primary">Publicar</button></form>'
  +'<table style="margin-top:10px"><thead><tr><th>Produto</th><th style="text-align:right">Preço</th><th style="text-align:right">Stock</th></tr></thead><tbody>'+meus.map(function(p){return '<tr><td>'+p.em+' '+esc(p.nome)+'</td><td style="text-align:right">'+eur(p.preco)+'</td><td style="text-align:right">'+p.stock+'</td></tr>';}).join('')+'</tbody></table></div>';
 $('#app').innerHTML=h;
 $('#vsel').onchange=function(e){S.vendedorAtual=e.target.value;gravar();vender();};
 if($('#stripe'))$('#stripe').onclick=function(){VEND[vid].stripe=true;toast('Conta Stripe ligada (simulação)');vender();};
 $('#novo').onclick=function(){var f=$('#fNovo');f.style.display=f.style.display==='none'?'block':'none';$('#pn').focus();};
 $('#fNovo').onsubmit=function(ev){ev.preventDefault();var c=$('#pc').value;S.prods.unshift(P('n'+Date.now(),$('#pn').value,c,vid,Number($('#pp').value),Number($('#ps').value),CATS.filter(function(x){return x[0]===c;})[0][2],'Produto novo publicado na demonstração.'));gravar();toast('Produto publicado na loja');vender();};
 [].forEach.call(document.querySelectorAll('[data-env]'),function(b){b.onclick=function(){S.enc.forEach(function(e){if(e.id===b.dataset.env){e.estado='fulfilled';e.env='CTT 3x00 '+(1000+Math.floor(Math.random()*8999))+' '+(10+Math.floor(Math.random()*89))+'PT';}});gravar();toast('Encomenda marcada como enviada');vender();};});
}
function admin(){
 var pagas=S.enc.filter(function(e){return ['paid','transferred','fulfilled'].indexOf(e.estado)>=0;});
 var gmv=pagas.reduce(function(a,e){return a+totEnc(e);},0);
 var disp=S.enc.filter(function(e){return e.estado==='disputed';});
 var h='<div style="margin-top:26px"><span class="tag">Administração</span><h1 style="font-size:26px;margin:4px 0 0">Bazora · visão geral</h1></div>';
 h+='<div class="kpis"><div class="kpi"><small>Volume pago</small><b>'+eur(gmv)+'</b></div><div class="kpi"><small>Comissão (10 %)</small><b>'+eur(gmv*COMISSAO)+'</b></div><div class="kpi"><small>Vendedores</small><b>'+Object.keys(VEND).length+'</b></div><div class="kpi"><small>Disputas abertas</small><b>'+disp.length+'</b></div></div>';
 h+='<div class="panel"><h2>Disputas</h2>'+(disp.length?disp.map(function(e){return '<div class="citem"><div style="flex:1"><strong>'+e.id+'</strong> <span class="muted">· '+esc(e.cliente)+' · '+eur(totEnc(e))+'</span><div class="muted" style="font-size:13px">'+esc(e.disputa||'')+'</div></div><button class="btn sm" data-res="'+e.id+'|fulfilled">Dar razão ao vendedor</button><button class="btn sm" data-res="'+e.id+'|refunded">Reembolsar cliente</button></div>';}).join(''):'<p class="muted">Sem disputas abertas.</p>')+'</div>';
 h+='<div class="panel"><h2>Pedidos para vender</h2>'+(S.candidaturas.length?S.candidaturas.map(function(c){return '<div class="citem"><div style="flex:1"><strong>'+esc(c.nome)+'</strong> <span class="muted">· '+(c.tipo==='marca'?'Marca':'Pessoa')+' · '+esc(CATS.filter(function(x){return x[0]===c.cat;})[0][1])+' · '+c.data+'</span></div><button class="btn sm primary" data-ap="'+c.id+'">Aprovar</button><button class="btn sm" data-rj="'+c.id+'">Recusar</button></div>';}).join(''):'<p class="muted">Sem pedidos pendentes.</p>')+'</div>';
 h+='<div class="panel"><h2>Todas as encomendas</h2><table><thead><tr><th>N.º</th><th>Data</th><th>Cliente</th><th>Pagamento</th><th style="text-align:right">Total</th><th>Estado</th></tr></thead><tbody>'+S.enc.map(function(e){return '<tr><td>'+e.id+'</td><td>'+e.data+'</td><td>'+esc(e.cliente)+'</td><td>'+e.metodo+'</td><td style="text-align:right">'+eur(totEnc(e))+'</td><td>'+st(e.estado)+'</td></tr>';}).join('')+'</tbody></table></div>';
 $('#app').innerHTML=h;
 [].forEach.call(document.querySelectorAll('[data-res]'),function(b){b.onclick=function(){var x=b.dataset.res.split('|');S.enc.forEach(function(e){if(e.id===x[0])e.estado=x[1];});gravar();toast(x[1]==='refunded'?'Cliente reembolsado':'Disputa resolvida a favor do vendedor');admin();};});
 [].forEach.call(document.querySelectorAll('[data-ap]'),function(b){b.onclick=function(){S.candidaturas=S.candidaturas.filter(function(c){return c.id!==b.dataset.ap;});gravar();toast('Vendedor aprovado');admin();};});
 [].forEach.call(document.querySelectorAll('[data-rj]'),function(b){b.onclick=function(){S.candidaturas=S.candidaturas.filter(function(c){return c.id!==b.dataset.rj;});gravar();toast('Pedido recusado');admin();};});
}
function rota(){
 var h=location.hash.replace(/^#\/?/,'').split('/');
 [].forEach.call(document.querySelectorAll('[data-nav]'),function(a){a.classList.toggle('on',a.dataset.nav===h[0]);});
 if(h[0]==='p')produto(h[1]);else if(h[0]==='carrinho')carrinho();else if(h[0]==='checkout')checkout();else if(h[0]==='encomendas')encomendas(h[1]);else if(h[0]==='vender')vender();else if(h[0]==='admin')admin();else loja();
 window.scrollTo(0,0);
}
$('#repor').onclick=function(){try{localStorage.removeItem(CH);}catch(e){}S=inicial();nCarr();location.hash='#/';rota();toast('Demonstração reposta');};
window.addEventListener('hashchange',rota);nCarr();rota();
})();
</script>
